name: build-ipa
on:
  workflow_dispatch:
  push:
    paths:
      - "DAT-iPhone/**"
      - ".github/workflows/build-ipa.yml"
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned CI)
        run: |
          xcodebuild -scheme GlassOpenClaw -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO build
        continue-on-error: true
      - name: Zip unsigned .app for Sideloadly (free Apple ID)
        continue-on-error: true
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'GlassOpenClaw.app' | head -1)
          echo "app=$APP"
          mkdir -p Payload
          if [ -n "$APP" ]; then cp -R "$APP" Payload/; zip -r GlassOpenClaw-unsigned.ipa Payload; fi
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlassOpenClaw-unsigned
          path: |
            GlassOpenClaw-unsigned.ipa
            Payload/**
          if-no-files-found: ignore
