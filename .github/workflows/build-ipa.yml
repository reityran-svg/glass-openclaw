name: build-ipa
on:
  workflow_dispatch:
  push:
    paths:
      - "DAT-iPhone/**"
      - ".github/workflows/build-ipa.yml"
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned CI)
        run: |
          xcodebuild -scheme GlassOpenClaw -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO build
        continue-on-error: true
      - name: Archive + TestFlight
        if: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          brew install fastlane
          fastlane ios beta
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: glassopenclaw-src
          path: .
          if-no-files-found: ignore
