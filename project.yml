name: GlassOpenClaw
options:
  bundleIdPrefix: com.tyran
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
targets:
  GlassOpenClaw:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyran.glassopenclaw
        INFOPLIST_FILE: Sources/Info.plist
        DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Glass OpenClaw
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Glasses-to-OpenClaw voice capture
        NSSpeechRecognitionUsageDescription: On-device speech for Hey Grok wake
        NSCameraUsageDescription: Glasses camera via DAT
        UIBackgroundModes:
          - audio
          - bluetooth-central
        MWDAT:
          AppLinkURLScheme: glassopenclaw://
          MetaAppID: "0"
          ClientToken: "AR|0|1"
          TeamID: "$(DEVELOPMENT_TEAM)"
          Analytics:
            OptOut: true
          CrashReporting:
            OptOut: true
    # DAT SPM linked locally in Xcode; CI unsigned IPA is Speech+HTTPS only so Sideloadly always gets an artifact.
